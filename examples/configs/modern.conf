# Hardened server. Synthetic example.
http {
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 443 ssl http2;
        server_name www.example.test;
        ssl_certificate     /etc/ssl/www.pem;
        ssl_certificate_key /etc/ssl/www.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!RC4;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /static/ {
            alias /srv/www/static/;
        }

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}

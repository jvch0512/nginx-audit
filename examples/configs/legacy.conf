# Old public site. Synthetic example.
http {
    autoindex on;
    client_max_body_size 0;

    server {
        listen 443 ssl;
        server_name old.example.test;
        ssl_certificate     /etc/ssl/old.pem;
        ssl_certificate_key /etc/ssl/old.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'HIGH:RC4-SHA:DES-CBC3-SHA:!aNULL';
        server_tokens on;

        location /img {
            alias /srv/www/images/;
        }

        location /status {
            stub_status;
        }

        location /api/ {
            proxy_pass https://backend.internal;
            proxy_ssl_verify off;
        }
    }
}
